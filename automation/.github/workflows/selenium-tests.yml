name: BugLens Selenium Regression

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  selenium-tests:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Selenium Regression Tests
        run: mvn -f automation/pom.xml test -DbaseUrl="${{ secrets.BUGLENS_URL }}"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BugLens-Selenium-Reports
          path: target/surefire-reports/